%YAML 1.2

scheduler:
  num_decompress_ops: 3
  worker_threads: 4

image_src:
  zmq_endpoint: "tcp://172.23.82.48:31001"
  receive_timeout_ms: 100
  batch_size: 64

decompress_op:
  data_size: [514, 1030]
  data_dtype: uint16

position_src:
  #zmq_endpoint: "tcp://bl13j-ea-serv-02:6666"
  zmq_endpoint: "tcp://172.23.82.204:6666"
  receive_timeout_ms: 1000

header_src:
  # Dedicated ZMQ SUB socket for live scan-geometry headers (PR2). A JSON
  # object with npoints_h/npoints_v/step_size_h/step_size_v/num_projections
  # reconfigures scan geometry on the fly and preempts an in-flight recon.
  zmq_endpoint: "tcp://172.23.82.204:6667"  # production endpoint (placeholder — adjust)
  receive_timeout_ms: 100

masking_op:
  center_x: 257
  center_y: 515
  radius: 128

sink_and_publish_op:
  publish_tensors: ["positions", "positions_ids", "inner", "outer", "intensity_ids"]
  publish_folder: null
  # publish_folder: "./processed"
  temp_folder: "./temp"
  backend: "zmq"  # Options: "nats" or "zmq"
  backend_endpoint: "tcp://localhost:6010"  # ZMQ endpoint or NATS host:port
  # backend: "nats"  # Options: "nats" or "zmq"
  # backend_endpoint: "localhost:6000"  # ZMQ endpoint or NATS host:port

ptychography:
  enabled: true
  ptyrex_config: "/workdir/test_data/pty_config_15keV_streamTest_6mm.json"
  scan_ID: [1, 1, 1]
  ID: [1, 1, 1]
  # Scan grid now comes from the live header (header_src). max_npoints_* set the
  # GPU buffer capacity (allocated once, never realloced — R-6); default_step_*
  # is the startup geometry before any header arrives. (Legacy no_frames/R/
  # scan_range below are unused — dead keys, S3, left for a separate cleanup.)
  max_npoints_h: 32   # capacity = 32*32 = 1024 frames (matches prior no_frames: 1024)
  max_npoints_v: 32   # bump these (with GPU RAM in mind) if larger scans are needed
  default_step_size_h: 0.25
  default_step_size_v: 0.25
  no_frames: 1024
  total_iterations: 20
  post_stream_iterations: 1
  housekeeping_interval: 2
  publish_interval: 1
  max_blocked_frames: 640
  reset_probe: false   # false = carry previous scan's probe forward (warm start); true = full probe reset each scan
  scan_range: [[0.0, 0.0], [0.0, 0.0]]  # [[x1, y1], [x2, y2]] motor coords (µm)
  R: [351.0, 364.0]  # scan range in pixels; must match actual scan extent

