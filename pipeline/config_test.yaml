%YAML 1.2

scheduler:
  num_decompress_ops: 3
  worker_threads: 4

image_src:
  # zmq_endpoint: "tcp://20.10.37.101:31001"  # Production endpoint
  zmq_endpoint: "tcp://localhost:5555"        # Local simulator
  receive_timeout_ms: 1000  # Increased timeout for testing
  batch_size: 128         # Larger batch for testing

decompress_op:
  # data_size: [192, 192]  # Match selun test data (192x192 images)
  data_size: [515, 515]  # Match selun test data (192x192 images)
  data_dtype: uint16

position_src:
  zmq_endpoint: "tcp://localhost:5556"
  receive_timeout_ms: 1000  # Increased timeout for testing

masking_op:
  center_x: 256  # Adjusted for 192x192 images (center)
  center_y: 256  # Adjusted for 192x192 images (center)
  radius: 25    # Adjusted proportionally

sink_and_publish_op:
  publish_tensors: ["positions", "positions_ids", "inner", "outer", "intensity_ids"]
  publish_folder: null
  # publish_folder: "./processed"
  temp_folder: "./temp"
  backend: "zmq"  # Options: "nats" or "zmq"
  backend_endpoint: "tcp://*:6020"  # ZMQ endpoint or NATS host:port
  # backend: "nats"  # Options: "nats" or "zmq"
  # backend_endpoint: "localhost:6000"  # ZMQ endpoint or NATS host:port

ptychography:
  enabled: true  # toggle on when ready to test
  ptyrex_config: "/workdir/test_data/config.json"
  scan_ID: [1, 1, 1]
  ID: [1, 1, 1]
  no_frames: 1024
  total_iterations: 30
  post_stream_iterations: 5
  housekeeping_interval: 1
  publish_interval: 1
  scan_range: [[-0.0037975, 0.0035316], [-0.0037504, 0.0035787]]  # [[x1,y1],[x2,y2]] motor coords
  R: [740.93, 740.99]  # scan range in pixels; must match actual scan extent
