%YAML 1.2

scheduler:
  num_decompress_ops: 3
  worker_threads: 4

image_src:
  #zmq_endpoint: "tcp://172.23.82.48:31001"  # Production endpoint
  zmq_endpoint: "tcp://172.23.82.77:5555"        # Local simulator
  receive_timeout_ms: 1000  # Increased timeout for testing
  batch_size: 600         # Larger batch for testing

decompress_op:
  # data_size: [192, 192]  # Match selun test data (192x192 images)
  data_size: [514, 1030]  # Match selun test data (192x192 images)
  data_dtype: uint16

position_src:
  zmq_endpoint: "tcp://172.23.82.77:5556" # Local simulator
  #zmq_endpoint: "tcp://172.23.82.204:6666" # production endpoint
  receive_timeout_ms: 1000  # Increased timeout for testing

header_src:
  # Dedicated ZMQ SUB socket for live scan-geometry headers (PR2). A JSON
  # object with npoints_h/npoints_v/step_size_h/step_size_v/num_projections
  # reconfigures scan geometry on the fly and preempts an in-flight recon.
  zmq_endpoint: "tcp://172.23.82.77:5558" # Local simulator
    #zmq_endpoint: "tcp://172.23.82.204:6667" # production endpoint (placeholder)
  receive_timeout_ms: 100  # short so the blocking recv doesn't hold a worker thread

masking_op:
  center_x: 524  # Adjusted for 192x192 images (center)
  center_y: 287  # Adjusted for 192x192 images (center)
  radius: 15    # Adjusted proportionally

sink_and_publish_op:
  publish_tensors: ["positions", "positions_ids", "inner", "outer", "intensity_ids"]
  #publish_folder: null
  publish_folder: "/workdir/test_data" #"./processed"
  temp_folder: "./temp"
  backend: "zmq"  # Options: "nats" or "zmq"
  backend_endpoint: "tcp://*:6020"  # ZMQ endpoint or NATS host:port
  # backend: "nats"  # Options: "nats" or "zmq"
  # backend_endpoint: "localhost:6000"  # ZMQ endpoint or NATS host:port

ptychography:
  enabled: true
  ptyrex_config: "/workdir/PtyREX/config_409907.json"
  scan_ID: [1, 1, 1]
  ID: [1, 1, 1]
  # Scan grid now comes from the live header (header_src). These set the GPU
  # buffer capacity (allocated once, never realloced — R-6) and the default
  # geometry used at startup before any header arrives.
  max_npoints_h: 200        # buffer capacity + startup default grid (horizontal)
  max_npoints_v: 100        # buffer capacity + startup default grid (vertical)
  # capacity = 100*100 = 10000 frames (matches the prior committed 100x100 grid;
  # a header requesting more frames is rejected — bump these with GPU RAM in mind)
  default_step_size_h: 0.2 # startup step size (microns), until a header arrives
  default_step_size_v: 0.2 # startup step size (microns), until a header arrives
  total_iterations: 35
  post_stream_iterations: 1
  housekeeping_interval: 1
  publish_interval: 1
  reset_probe: true  # false = carry previous scan's probe forward (warm start); true = full probe reset each scan
